server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # HTML y catalogo siempre frescos
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /products.json { add_header Cache-Control "no-cache"; }

  # API Drive en vivo (contenedor api). La tienda es 100% Drive (sin fallback estatico).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  # Imagenes con cache largo (los nombres llevan hash)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Hero (video + poster): cache 7 dias
  location ~ ^/(hero\.mp4|hero-poster\.jpg|hot-sale\.jpg|logo-kanada\.png)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location / { try_files $uri $uri/ =404; }
}
